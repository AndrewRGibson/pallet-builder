[project]
name = "pallet-builder"
version = "0.1.17"  # 0.1.<commit count>; the runtime version is read from git
description = "Single-case pallet loading optimizer with a Streamlit planner UI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrew Gibson", email = "gibson.ar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "plotly>=7.1.0",
    # Pinned to the minor version: ui/style.py styles Streamlit's internal element IDs, which can change
    # between releases (tests/test_app.py checks they still exist before an upgrade).
    "streamlit>=1.65.0,<1.66",
]

[project.scripts]
pallet-builder = "pallet_builder:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
# The Streamlit UI package (ui/) lives at the repo root next to app.py.
pythonpath = ["."]
