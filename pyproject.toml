[project]
name = "pallet-builder"
version = "0.1.0"
description = "Single-case pallet loading optimizer with a Streamlit planner UI"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Andrew Gibson", email = "gibson.ar@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "streamlit>=1.65.0",
]

[project.scripts]
pallet-builder = "pallet_builder:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
